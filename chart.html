<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Geostrat — Chokepoint throughput</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @font-face {
    font-family: "Space Grotesk"; font-style: normal; font-weight: 400 700;
    src: local("Space Grotesk");
  }
  html, body {
    background: #0B1020; color: #E8E6DF; margin: 0; padding: 0;
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px 24px; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: #9AA3B7; margin: 0 0 4px;
  }
  h1 b { color: #E8A33D; }
  .sub {
    font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.08em; color: #9AA3B7; margin-bottom: 18px;
  }
  .chart { width: 100%; }
  .controls {
    display: flex; gap: 18px; align-items: center; margin: 14px 0 0;
    font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
    font-size: 11.5px; color: #9AA3B7; letter-spacing: 0.06em;
  }
  .controls a, .controls label {
    color: #E8C98A; text-decoration: none; cursor: pointer;
    padding: 4px 8px; border: 1px solid #1C2336; border-radius: 4px;
    background: #11172A;
  }
  .controls a.active, .controls label.active { background: #E8A33D; color: #0B1020; border-color: #E8A33D; }
  .footer {
    margin-top: 22px; font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px; color: #5A6379; letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Geostrat · <b>Chokepoint throughput</b></h1>
  <div class="sub">IMF PortWatch · % of pre-war baseline (1 Jan – 27 Feb 2026)</div>
  <div id="chart" class="chart"></div>
  <div class="controls">
    METRIC:
    <a href="?metric=tanker" id="m-tanker">TANKERS</a>
    <a href="?metric=all" id="m-all">ALL VESSELS</a>
    <span style="flex:1"></span>
    <span id="generated"></span>
  </div>
  <div class="footer">
    Source: IMF PortWatch · Daily_Chokepoints_Data ArcGIS service. Author's calculation vs.
    1 Jan – 27 Feb 2026 baseline. Watermark: Geostrat.
  </div>
</div>

<script src="data/energy/throughput-chart.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var metric = params.get("metric") === "all" ? "all" : "tanker";
  var primary = params.get("primary") || "hormuz";
  document.getElementById("m-" + metric).classList.add("active");

  fetch("data/energy/chokepoint_series.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("chokepoint_series.json HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      var gen = document.getElementById("generated");
      if (gen && data.generated) gen.textContent = "GENERATED " + data.generated;
      if (data._placeholder) {
        gen.textContent += " · PLACEHOLDER (awaiting first PortWatch CI run)";
        gen.style.color = "#C44569";
      }
      window.renderThroughputChart(document.getElementById("chart"), data, {
        metric: metric, primary: primary
      });
    })
    .catch(function (e) {
      document.getElementById("chart").innerHTML =
        '<div style="color:#C44569;padding:20px;font-family:monospace">' +
        'Failed to load chokepoint_series.json: ' + e.message + '</div>';
    });
})();
</script>
</body>
</html>
