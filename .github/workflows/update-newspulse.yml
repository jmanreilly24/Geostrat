name: Update news pulse
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GDELT news-pulse
        run: python scripts/update_newspulse.py
      - name: Commit if changed
        run: |
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newspulse.geojson
          if git diff --staged --quiet; then echo "No changes."; else
            git commit -m "Update news pulse $(date -u +%FT%H:%MZ)"; git push; fi
