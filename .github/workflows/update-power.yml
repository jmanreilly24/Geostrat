name: Update power index
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build power index from World Bank
        run: python scripts/update_power.py
      - name: Commit if changed
        run: |
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power-index.json
          if git diff --staged --quiet; then echo "No changes."; else
            git commit -m "Update power index $(date -u +%F)"; git push; fi
