name: Build historical snapshots
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 2016-2025 World Bank snapshots
        run: python scripts/build_history.py
      - name: Commit if changed
        run: |
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --staged --quiet; then echo "No changes."; else
            git commit -m "Build history snapshots $(date -u +%F)"; git push; fi
