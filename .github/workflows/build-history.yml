name: Build historical snapshots
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build World Bank snapshots (2000-2025)
        run: python scripts/build_history.py
      - name: Commit if changed
        run: |
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Build history snapshots $(date -u +%F)"
          # Other update-* workflows can finish and push in parallel; rebase
          # onto whatever main looks like right now before pushing back.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep $((i*5))
          done
          echo "could not push after 5 attempts"; exit 1
