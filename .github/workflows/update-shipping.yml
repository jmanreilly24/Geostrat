name: Update shipping traffic
on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch PortWatch chokepoint traffic + series
        run: python scripts/update_shipping.py
      - name: Commit if changed
        run: |
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          if [ -s data/portwatch.json ]; then
            git add data/portwatch.json
            changed=1
          else
            echo "data/portwatch.json missing/empty -- skipping."
          fi
          if [ -s data/energy/chokepoint_series.json ]; then
            git add data/energy/chokepoint_series.json
            changed=1
          else
            echo "data/energy/chokepoint_series.json missing/empty -- skipping."
          fi
          if [ "$changed" = "0" ]; then
            echo "No output files produced. Exiting cleanly."
            exit 0
          fi
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update shipping traffic $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep $((i*5))
          done
          echo "could not push after 5 attempts"; exit 1
