name: Update V-Dem libdem
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch V-Dem liberal democracy index
        run: python scripts/update_vdem.py
      - name: Commit if changed
        run: |
          if [ ! -f data/vdem.json ]; then
            echo "No data/vdem.json produced — fetch likely failed. Skipping commit."
            exit 0
          fi
          git config user.name "geostrat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vdem.json
          if git diff --staged --quiet; then echo "No changes."; else
            git commit -m "Update V-Dem libdem $(date -u +%F)"; git push; fi
